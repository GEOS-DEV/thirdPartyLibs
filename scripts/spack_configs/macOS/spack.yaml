spack:
  config:
    install_tree:
      root: $spack/..
      projections:
        all: '{compiler.name}-{compiler.version}/{name}-{version}-{hash}'
    misc_cache: $spack/../misc_cache
    test_stage: $spack/../test_stage
    build_stage:
    - $spack/../build_stage

  # Regular TPLs do not need views
  view: false

  # Include shared variants and versions
  include:
  - ../defaults.yaml
  - ../versions.yaml

  packages:
    all:
      target: [aarch64]
      variants: "~openmp"

    # Spack 1.2 models compilers as package externals. Apple Clang supplies
    # C/C++, while Homebrew GCC supplies only the Fortran language virtual.
    c:
      require: "apple-clang@=17.0.0"
    cxx:
      require: "apple-clang@=17.0.0"
    fortran:
      require: "gcc@=16.2.0 languages:=fortran"

    apple-clang:
      buildable: false
      externals:
      - spec: "apple-clang@=17.0.0 platform=darwin os=tahoe target=aarch64"
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/clang
            cxx: /usr/bin/clang++
          environment:
            set:
              AR: /usr/bin/ar
              RANLIB: /usr/bin/ranlib
              CMAKE_AR: /usr/bin/ar
              CMAKE_RANLIB: /usr/bin/ranlib
            prepend_path:
              PATH: /usr/bin
            remove_path:
              PATH: /opt/homebrew/opt/binutils/bin

    gcc:
      buildable: false
      externals:
      - spec: "gcc@=16.2.0 languages:=fortran platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/gcc
        extra_attributes:
          compilers:
            fortran: /opt/homebrew/opt/gcc/bin/gfortran-16
          environment:
            set:
              AR: /usr/bin/ar
              RANLIB: /usr/bin/ranlib
              CMAKE_AR: /usr/bin/ar
              CMAKE_RANLIB: /usr/bin/ranlib
            prepend_path:
              PATH: /usr/bin
            remove_path:
              PATH: /opt/homebrew/opt/binutils/bin

    geosx:
      require: "+addr2line ~openmp"

    # Lock virtual dependencies to the matching Homebrew externals. zlib-api
    # remains buildable so Spack supplies zlib instead of a nonexistent keg.
    mpi:
      buildable: false
      require: "openmpi@=5.0.10"
    blas:
      buildable: false
      require: "openblas@=0.3.34"
    lapack:
      buildable: false
      require: "openblas@=0.3.34"
    pkgconfig:
      buildable: false
      require: "pkgconf@=3.0.6"
    zlib-api:
      require: "zlib@=1.3.2"

    # These tools/libraries are intentionally Spack-built rather than modeled
    # as nonexistent Homebrew kegs.
    zlib:
      buildable: true
      require: "@=1.3.2 +pic +shared"
    perl:
      buildable: true
      require: "@=5.42.2"
    diffutils:
      buildable: true
      require: "@=3.12"

    openblas:
      buildable: false
      externals:
      - spec: >-
          openblas@=0.3.34
          +fortran ~ilp64 +pic +shared +static
          +dynamic_dispatch +locking ~bignuma ~consistent_fpcsr
          threads=openmp max_num_threads=56 symbol_suffix=none
          platform=darwin os=tahoe target=aarch64
        prefix: /opt/homebrew/opt/openblas

    openmpi:
      buildable: false
      externals:
      - spec: >-
          openmpi@=5.0.10
          +fortran +ipv6 +romio
          ~internal-hwloc ~internal-libevent ~internal-pmix ~static
          fabrics:=none schedulers:=sge
          platform=darwin os=tahoe target=aarch64
        prefix: /opt/homebrew/opt/open-mpi

    # Homebrew system packages. Perl, diffutils, and zlib are intentionally not
    # external: Spack builds those dependencies for a complete, valid prefix.
    cmake:
      buildable: false
      externals:
      - spec: "cmake@=3.31.6 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/cmake@3.31.6
    readline:
      buildable: false
      externals:
      - spec: "readline@=8.3 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/readline

    m4:
      buildable: false
      externals:
      - spec: "m4@=1.4.21 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/m4
    pkgconf:
      buildable: false
      externals:
      - spec: "pkgconf@=3.0.6 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/pkgconf

    autoconf:
      buildable: false
      externals:
      - spec: "autoconf@=2.73 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/autoconf
    automake:
      buildable: false
      externals:
      - spec: "automake@=1.18.1 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/automake
    libtool:
      buildable: false
      externals:
      - spec: "libtool@=2.6.2 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/libtool
    gettext:
      buildable: false
      externals:
      - spec: "gettext@=1.0 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/gettext

    binutils:
      buildable: false
      externals:
      - spec: >-
          binutils@=2.47 libs:=static
          platform=darwin os=tahoe target=aarch64
        prefix: /opt/homebrew/opt/binutils

    python:
      buildable: false
      externals:
      - spec: "python@=3.14.7 platform=darwin os=tahoe target=aarch64"
        prefix: /opt/homebrew/opt/python@3.14
